name: Deploy

# A full .NET build and Lambda deploy for a documentation edit is wasted work.
# The negative pattern has to come last — filters are evaluated in order — and it
# is needed because GuitarStore.Web/README.md would otherwise match the allowlist
# above. A push mixing Markdown with code still deploys, since the code file
# matches a positive pattern and nothing excludes it.
on:
  push:
    branches: [master, rebuild/dotnet10-aws]
    paths:
      - 'GuitarStore.Web/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
      - '!**.md'
  workflow_dispatch:

# Required for OIDC: the workflow requests a token AWS trades for temporary credentials.
# No AWS keys are stored in GitHub.
permissions:
  id-token: write
  contents: read

# One deploy at a time; never cancel a run mid-deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Lambda
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build GuitarStore.Web.slnx -c Release --warnaserror

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/guitarstore-github-actions
          aws-region: us-east-2

      - name: Deploy
        id: deploy
        run: ./infra/deploy.sh --code

      # Deliberately the API Gateway endpoint and not guitarstore.mattsauro.com:
      # this verifies the artifact the step above just deployed, not the custom
      # domain and DNS in front of it. The URL comes from the deploy script so
      # nothing here hardcodes the generated API id.
      - name: Smoke test
        run: |
          URL="${{ steps.deploy.outputs.endpoint }}"
          [ -n "$URL" ] || { echo "::error::deploy step produced no endpoint"; exit 1; }
          for path in / /Product/List/Guitar /Cart; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL$path")"
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          # Admin routes must stay behind authentication.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/ProductAdmin")"
          echo "/ProductAdmin -> $code"
          [ "$code" = "302" ] || { echo "::error::/ProductAdmin returned $code, expected a redirect to sign-in"; exit 1; }
